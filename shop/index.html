<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --brand:#2A6B3A;--brand-light:#4A9B5A;--gold:#C8922A;--cream:#FAF7F2;
  --dark:#1A1A18;--muted:#6B6B62;--border:#E2DDD4;--red:#C0392B;--paper:#fff;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--dark);line-height:1.55;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,247,242,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 5%;height:60px;}
.nav-store{font-family:'DM Serif Display',serif;font-size:18px;color:var(--brand);}
.nav-tagline{font-size:11px;color:var(--muted);}
/* Hero */
.page-header{background:var(--brand);padding:90px 5% 42px;color:#fff;}
.page-header-inner{max-width:920px;margin:0 auto;}
.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:.6rem;}
.page-header h1{font-family:'DM Serif Display',serif;font-size:clamp(28px,4vw,42px);line-height:1.15;margin-bottom:.3rem;}
.hero-en{font-family:'DM Serif Display',serif;font-size:18px;color:rgba(255,255,255,.80);margin-bottom:.5rem;}
.page-header p{font-size:14px;color:rgba(255,255,255,.82);max-width:520px;}
/* 节日推广区 */
.promo-section{background:linear-gradient(135deg,#0D4A2F 0%,#1A6B4A 55%,#0D3B22 100%);padding:44px 5%;color:#fff;position:relative;overflow:hidden;}
.promo-deco{position:absolute;font-size:200px;opacity:.05;right:-10px;top:-30px;transform:rotate(-10deg);pointer-events:none;line-height:1;}
.promo-inner{max-width:920px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start;}
@media(max-width:820px){.promo-inner{grid-template-columns:1fr;}}
.promo-badge{display:inline-block;background:rgba(200,146,42,.22);border:1px solid rgba(200,146,42,.55);color:#F0C060;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 14px;border-radius:20px;margin-bottom:14px;}
.promo-title-zh{font-family:'DM Serif Display',serif;font-size:38px;color:#F0C060;line-height:1.1;margin-bottom:4px;}
.promo-title-en{font-size:17px;color:rgba(255,255,255,.88);font-weight:500;margin-bottom:6px;}
.promo-date{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:14px;}
.promo-tagline{font-size:15px;color:rgba(255,255,255,.92);font-style:italic;margin-bottom:14px;line-height:1.7;}
.promo-intro{font-size:13px;color:rgba(255,255,255,.70);line-height:1.9;}
.promo-items{display:flex;flex-direction:column;gap:10px;}
.promo-item{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:13px 16px;display:flex;align-items:center;gap:13px;}
.promo-item-icon{font-size:26px;flex-shrink:0;}
.promo-item-zh{font-size:14px;font-weight:600;}
.promo-item-en{font-size:11px;color:rgba(255,255,255,.58);margin-top:2px;}
.promo-item-note{margin-left:auto;font-size:11px;background:rgba(200,146,42,.28);color:#F0C060;padding:3px 10px;border-radius:12px;white-space:nowrap;flex-shrink:0;}
.promo-item-add{margin-left:auto;font-size:12px;background:var(--gold);color:#fff;border:none;padding:5px 12px;border-radius:12px;cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap;flex-shrink:0;}
/* 品类导航 */
.search-section{background:#fff;padding:12px 5% 0;border-bottom:none;}
.search-section input{width:100%;max-width:560px;display:block;margin:0 auto;border:1.5px solid var(--border);border-radius:24px;padding:10px 20px;font-size:14px;font-family:inherit;outline:none;background:#faf9f7;}
.search-section input:focus{border-color:var(--brand);}
.search-label{text-align:center;font-size:13px;color:var(--muted);padding:8px 0 4px;}
.cat-tabs-section{background:#fff;border-bottom:1px solid var(--border);padding:16px 5%;}
.cat-tabs{max-width:920px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;}
.cat-tab{padding:9px 18px;border:1.5px solid var(--brand);border-radius:30px;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--brand);font-family:inherit;transition:background .15s,color .15s;white-space:nowrap;}
.cat-tab:hover,.cat-tab.active{background:var(--brand);color:#fff;}
/* 品类卡片 */
.cat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:4px 0;}
.cat-card{background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:22px 12px 18px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s,color .15s;}
.cat-card:hover{border-color:var(--brand);background:var(--brand);color:#fff;}
.cat-card:hover .cat-card-en{color:rgba(255,255,255,.72);}
.cat-card-icon{font-size:30px;margin-bottom:8px;}
.cat-card-zh{font-size:14px;font-weight:600;}
.cat-card-en{font-size:11px;color:var(--muted);margin-top:3px;}
.cat-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--brand);cursor:pointer;margin-bottom:14px;font-weight:500;}
.cat-back:hover{text-decoration:underline;}
.empty-cat{padding:48px 0;text-align:center;color:var(--muted);font-size:14px;line-height:2.2;}
/* 商品区 */
.shop-body{padding:36px 5%;max-width:920px;margin:0 auto;display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start;}
@media(max-width:820px){.shop-body{grid-template-columns:1fr;}}
.product-row{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--border);}
.prod-img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#f5f5f0;}
.prod-img-placeholder{width:72px;height:72px;border-radius:8px;flex-shrink:0;background:#f0f0ea;display:flex;align-items:center;justify-content:center;font-size:28px;}
.prod-info{flex:1;}
.prod-info h3{font-size:15px;font-weight:600;}
.prod-info .zh{font-size:13px;color:var(--muted);}
.prod-info .spec{font-size:11.5px;color:var(--muted);margin-top:2px;}
.prod-info .price{font-size:14px;font-weight:600;color:var(--dark);margin-top:5px;font-variant-numeric:tabular-nums;}
.qty-control{display:flex;align-items:center;gap:10px;}
.qty-btn{width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:3px;font-size:17px;cursor:pointer;color:var(--brand);line-height:1;}
.qty-btn:hover{border-color:var(--brand);}
.qty-num{min-width:22px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;}
/* 购物车 */
.cart-box{background:#fff;border:1px solid var(--border);border-radius:6px;padding:18px;position:sticky;top:76px;}
.cart-box h3{font-family:'DM Serif Display',serif;font-size:18px;color:var(--brand);margin-bottom:12px;}
.cart-empty{font-size:13px;color:var(--muted);}
.cart-item{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;}
.cart-item-name{flex:1;}
.cart-item-price{font-variant-numeric:tabular-nums;}
.cart-totals{border-top:1px solid var(--border);margin-top:10px;padding-top:10px;}
.cart-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;}
.cart-row.total{font-weight:600;font-size:15px;border-top:1px solid var(--border);margin-top:6px;padding-top:8px;}
.free-tag{color:var(--brand-light);font-weight:600;}
.cart-note{font-size:12px;color:var(--gold);margin-top:8px;line-height:1.5;}
.zip-inline{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.zip-inline-label{font-size:13px;font-weight:500;margin-bottom:8px;}
.zip-inline-row{display:flex;gap:8px;}
.zip-input{border:1px solid var(--border);border-radius:3px;padding:9px 14px;font-size:14px;font-family:inherit;outline:none;flex:1;min-width:0;}
.zip-input:focus{border-color:var(--brand);}
.zip-btn{background:var(--brand);color:#fff;border:none;border-radius:3px;padding:9px 16px;font-size:14px;font-family:inherit;cursor:pointer;font-weight:500;white-space:nowrap;}
.zip-msg{font-size:12px;padding:6px 10px;border-radius:3px;margin-top:6px;}
.zip-msg.ok{background:#f0f7f2;color:#1A4A28;border:1px solid #9FD4B2;}
.zip-msg.err{background:#fdf2f2;color:var(--red);border:1px solid #e8a0a0;}
.checkout-btn{width:100%;background:var(--gold);color:#fff;border:none;border-radius:3px;padding:12px;font-size:15px;font-family:inherit;font-weight:500;cursor:pointer;margin-top:12px;}
.checkout-btn:disabled{opacity:.45;cursor:not-allowed;}
.stripe-note{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;}
footer{padding:30px 5%;text-align:center;font-size:12px;color:var(--muted);border-top:1px solid var(--border);margin-top:30px;}
footer a{color:var(--brand);}
.demo-flag{background:#FFF8E8;border-bottom:1px solid #F0D890;font-size:12px;color:#8a6d1f;text-align:center;padding:7px 5%;}
</style>
</head>
<body>

<nav>
  <span class="nav-store" id="navStore">店铺</span>
  <span class="nav-tagline" id="navTag"></span>
</nav>

<div class="demo-flag" id="demoFlag" style="display:none;"></div>

<header class="page-header">
  <div class="page-header-inner">
    <div class="eyebrow">Local Delivery · 本地配送</div>
    <h1 id="heroTitle">远东超市</h1>
    <p class="hero-en" id="heroEnName"></p>
    <p id="heroSub">选择品类，开始购物。</p>
  </div>
</header>

<!-- 节日推广区 -->
<div class="promo-section" id="promoSection" style="display:none;">
  <div class="promo-deco" id="promoDeco">🐉</div>
  <div class="promo-inner">
    <div>
      <div class="promo-badge" id="promoBadge">节日特推 Festival</div>
      <div class="promo-title-zh" id="promoTitleZh"></div>
      <div class="promo-title-en" id="promoTitleEn"></div>
      <div class="promo-date" id="promoDate"></div>
      <div class="promo-tagline" id="promoTagline"></div>
      <div class="promo-intro" id="promoIntroZh"></div>
      <div class="promo-intro" id="promoIntroEn" style="margin-top:8px;"></div>
    </div>
    <div class="promo-items" id="promoItems"></div>
  </div>
</div>

<!-- 品类导航 -->
<div class="search-section">
  <input id="searchBox" type="search" placeholder="🔍 搜索商品 Search products…" oninput="onSearch(this.value)" autocomplete="off">
  <div id="searchLabel" class="search-label" style="display:none;"></div>
</div>
<div class="cat-tabs-section">
  <div class="cat-tabs" id="catTabs">
    <button class="cat-tab" data-cat="condiments" onclick="setCat('condiments')">米面粮油调味 Pantry</button>
    <button class="cat-tab" data-cat="snacks"     onclick="setCat('snacks')">零食和饮料 Snacks</button>
    <button class="cat-tab" data-cat="frozen"     onclick="setCat('frozen')">冷冻食品 Frozen</button>
    <button class="cat-tab" data-cat="fresh"      onclick="setCat('fresh')">生鲜 Fresh</button>
    <button class="cat-tab" data-cat="grocery"    onclick="setCat('grocery')">百货 Grocery</button>
  </div>
</div>

<div class="shop-body" id="shopBody">
  <div class="products-col" id="productsCol"></div>
  <div class="cart-col">
    <div class="cart-box">
      <h3>购物车 Cart</h3>
      <div id="cartEmpty" class="cart-empty">购物车是空的 · Cart is empty.<br>请选择商品加入购物车。</div>
      <div id="cartItems"></div>
      <div id="cartTotals" class="cart-totals" style="display:none;">
        <div class="cart-row"><span>小计 Subtotal</span><span id="cartSubtotal"></span></div>
        <div class="cart-row"><span style="color:var(--muted);">配送 Delivery</span><span id="cartDelivery"></span></div>
        <div class="cart-row total"><span>合计 Total</span><span id="cartTotal"></span></div>
      </div>
      <p class="cart-note" id="cartNote" style="display:none;"></p>
      <div class="zip-inline" id="zipInline" style="display:none;">
        <p class="zip-inline-label">请输入邮编确认配送范围 · Enter your ZIP:</p>
        <div class="zip-inline-row">
          <input class="zip-input" id="zipCart" placeholder="ZIP Code" maxlength="5">
          <button class="zip-btn" onclick="confirmZipAndProceed()">确认 Confirm</button>
        </div>
        <div class="zip-msg" id="zipCartMsg" style="display:none;"></div>
      </div>
      <button class="checkout-btn" id="checkoutBtn" onclick="goToCheckout()" disabled>去结账 Checkout &rarr;</button>
      <p class="stripe-note">结账安全加密 · Secured by Stripe</p>
    </div>
  </div>
</div>

<footer>
  <p id="footStore">远东超市</p>
  <p id="footContact"></p>
</footer>

<script>
var CHECKOUT_URL = 'https://sorghuman.com/.netlify/functions/create-checkout';

var FALLBACK_CATALOG = {
  currency:'USD',
  categories:{
    condiments:'米面粮油和调味品 Pantry & Condiments',
    snacks:'零食和饮料 Snacks & Beverages',
    frozen:'冷冻食品 Frozen Foods',
    fresh:'生鲜 Fresh Produce',
    grocery:'百货 Grocery'
  },
  products:[
    {sku:'4650',  name_en:'Glutinous Rice Shaomai',        name_zh:'糯米烧卖',     spec:'16 oz / 6 pcs', category:'frozen', base_price:4.99, common:true},
    {sku:'6784',  name_en:'Three-Diced Beancurd-Skin Bun', name_zh:'三丁腐皮包',   spec:'16 oz / 6 pcs', category:'frozen', base_price:4.99, common:true},
    {sku:'7194',  name_en:"Shepherd's Purse Bun",          name_zh:'荠菜包',       spec:'16 oz / 6 pcs', category:'frozen', base_price:4.99, common:true},
    {sku:'7951',  name_en:'Dried Mustard Green Bun',       name_zh:'梅干菜包',     spec:'16 oz / 6 pcs', category:'frozen', base_price:4.99, common:true},
    {sku:'7985',  name_en:'Shredded Radish Bun',           name_zh:'千顺萝卜丝包', spec:'16 oz / 6 pcs', category:'frozen', base_price:4.99, common:true},
    {sku:'9615',  name_en:'Bok Choy & Shiitake Bun',       name_zh:'青菜香菇包',   spec:'16 oz / 6 pcs', category:'frozen', base_price:4.99, common:true},
    {sku:'9913',  name_en:'Adzuki Bean Bun',               name_zh:'豆沙包',       spec:'10.58 oz / 6 pcs', category:'frozen', base_price:4.99, common:true},
    {sku:'PLUM-1',   name_en:'Sour Plum Soup (single)',    name_zh:'酸梅汤 单瓶',  spec:'16 fl oz', category:'snacks', base_price:2.99, common:true},
    {sku:'PLUM-20',  name_en:'Sour Plum Soup (case/20)',   name_zh:'酸梅汤 整箱',  spec:'20x16 fl oz', category:'snacks', base_price:49.99, common:true},
    {sku:'PLUM-CONC',name_en:'Sour Plum Concentrate',      name_zh:'酸梅汁浓缩液', spec:'浓缩', category:'snacks', base_price:9.99, common:true},
    {sku:'RICE-ST25',name_en:'ST25 Vietnamese Rice',       name_zh:'蟹老伯ST25大米',spec:'5 kg', category:'snacks', base_price:25.00, common:true}
  ]
};

var FALLBACK_REGISTRY = {'fareastpa.com':'fareast','www.fareastpa.com':'fareast','sorghuman.com':'default'};

var FALLBACK_STORES = {
  fareast:{
    store_id:'fareast', name_zh:'远东超市', name_en:'Far East Asian Market',
    domain:'fareastpa.com', theme:'#2A6B3A',
    hero_image:'/images/stores/fareast.png',
    tagline:'您的社区亚洲超市 Your Neighborhood Asian Market',
    contact_email:'', contact_phone:'610-266-8968',
    delivery_zips:['18052','18067','18103','18104','18101','18017'],
    free_delivery_threshold:30, delivery_fee:5, markup:1.0,
    drop:[], add:[], prices:{'4650':5.49,'9913':5.29}
  },
  default:{
    store_id:'default', name_zh:'Sorghuman 高仁', name_en:'Sorghuman',
    domain:'sorghuman.com', delivery_zips:['18015','18017','18018','18020'],
    free_delivery_threshold:30, delivery_fee:5, markup:1.0, drop:[], add:[], prices:{}
  }
};

var CAT_INFO = [
  {cat:'featured',   icon:'🔥', zh:'爆品',             en:'Hot Items'},
  {cat:'condiments', icon:'🌾', zh:'米面粮油和调味品', en:'Pantry & Condiments'},
  {cat:'snacks',     icon:'🧃', zh:'零食和饮料',       en:'Snacks & Drinks'},
  {cat:'frozen',     icon:'❄',  zh:'冷冻食品',         en:'Frozen Foods'},
  {cat:'fresh',      icon:'🥬', zh:'生鲜',             en:'Fresh Produce'},
  {cat:'grocery',    icon:'🛒', zh:'百货',             en:'Grocery'}
];

var catalog = null, store = null, qty = {}, isDemo = false;
var activeCat = null, zipConfirmed = false;

function round2(n){ return Math.round(n*100)/100; }
function fmt(n){ return '$'+n.toFixed(2); }

async function tryFetch(url){
  try{
    var r = await fetch(url, {cache:'no-store'});
    if(!r.ok) return null;
    return await r.json();
  } catch(e){ return null; }
}

async function loadPromo(){
  // 优先用门店自己的活动，没有则用全局活动
  var sp = store && store.promo;
  if(sp && sp.active && (sp.title_zh || sp.title_en)){
    var sec = document.getElementById('promoSection');
    sec.style.display = 'block';
    // 用门店自定义颜色覆盖背景
    sec.style.background = sp.image
      ? 'linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),url('+sp.image+') center/cover'
      : (sp.color || '#1A4A28');
    document.getElementById('promoDeco').textContent    = '🎉';
    document.getElementById('promoBadge').textContent   = (sp.title_zh||'') + (sp.title_en?' · '+sp.title_en:'');
    document.getElementById('promoTitleZh').textContent = sp.title_zh||'';
    document.getElementById('promoTitleEn').textContent = sp.title_en||'';
    document.getElementById('promoDate').textContent    = '';
    document.getElementById('promoTagline').textContent = sp.subtitle||'';
    document.getElementById('promoIntroZh').textContent = '';
    document.getElementById('promoIntroEn').textContent = '';
    return;
  }
  // 全局活动（fallback）
  var p = await tryFetch('/promo/current.json');
  if(!p || !p.active) return;
  var sec = document.getElementById('promoSection');
  sec.style.display = 'block';
  document.getElementById('promoDeco').textContent    = p.icon || '🐉';
  document.getElementById('promoBadge').textContent   = (p.icon||'') + ' ' + p.festival_zh + ' · ' + p.festival_en;
  document.getElementById('promoTitleZh').textContent = p.festival_zh;
  document.getElementById('promoTitleEn').textContent = p.festival_en;
  document.getElementById('promoDate').textContent    = p.date_zh + ' · ' + p.date_en;
  document.getElementById('promoTagline').textContent = p.tagline_zh;
  document.getElementById('promoIntroZh').textContent = p.intro_zh;
  document.getElementById('promoIntroEn').textContent = p.intro_en;
  var box = document.getElementById('promoItems');
  box.innerHTML = '';
  (p.featured_items || []).forEach(function(item){
    var el = document.createElement('div');
    el.className = 'promo-item';
    var right = document.createElement(item.sku ? 'button' : 'span');
    right.className = item.sku ? 'promo-item-add' : 'promo-item-note';
    right.textContent = item.sku ? '加购 Add +' : '即将上架 Soon';
    if(item.sku){ right.onclick = function(){ addPromoSku(item.sku); }; }
    var info = document.createElement('div');
    info.innerHTML = '<div class="promo-item-zh">' + item.name_zh + '</div>' +
                     '<div class="promo-item-en">' + item.name_en + '</div>';
    var ico = document.createElement('div');
    ico.className = 'promo-item-icon';
    ico.textContent = item.icon || '';
    el.appendChild(ico);
    el.appendChild(info);
    el.appendChild(right);
    box.appendChild(el);
  });
}

function addPromoSku(sku){
  qty[sku] = (qty[sku]||0) + 1;
  var el = document.getElementById('q-'+sku);
  if(el) el.textContent = qty[sku];
  updateCart();
  var prod = (catalog.products||[]).filter(function(x){ return x.sku===sku; })[0];
  if(prod && prod.category && prod.category !== activeCat){ setCat(prod.category); }
}

async function boot(){
  if(new URLSearchParams(location.search).get('order')==='success'){
    var hdr = document.querySelector('.page-header');
    hdr.style.background = '#1A4A28';
    document.getElementById('heroTitle').textContent   = '谢谢您的订单！';
    document.getElementById('heroEnName').textContent  = 'Order Confirmed — Thank You!';
    document.getElementById('heroSub').textContent     = '我们将尽快安排配送。We will arrange delivery soon.';
  }

  var params  = new URLSearchParams(location.search);
  var forced  = params.get('store');
  var host    = location.hostname.replace(/^www\./,'');
  var registry = await tryFetch('/stores/index.json') || FALLBACK_REGISTRY;
  var storeId = forced || registry[location.hostname] || registry[host] || 'default';

  // 从 Supabase（经 get-catalog 函数）拉取门店商品目录
  var data = await tryFetch('/.netlify/functions/get-catalog?store='+storeId);
  if(data && data.store && data.products){
    store   = data.store;
    catalog = { currency:'USD', categories: data.categories, products: data.products };
  } else {
    catalog = FALLBACK_CATALOG;
    store   = FALLBACK_STORES[storeId] || FALLBACK_STORES['default'];
    isDemo  = true;
  }

  applyStore();
  loadPromo();
  renderProducts();
}

function applyStore(){
  document.documentElement.style.setProperty('--brand', store.theme||'#2A6B3A');
  document.getElementById('navStore').textContent   = store.name_zh;
  document.getElementById('navTag').textContent     = store.tagline||'';
  document.getElementById('heroTitle').textContent  = store.name_zh;
  document.getElementById('heroEnName').textContent = store.name_en||'';
  document.getElementById('heroSub').textContent    = '选择品类，开始购物。 Browse by category.';
  document.getElementById('footStore').textContent  = store.name_zh + (store.name_en ? ' · '+store.name_en : '');
  var parts = [];
  if(store.contact_phone) parts.push(store.contact_phone);
  if(store.contact_email) parts.push('<a href="mailto:'+store.contact_email+'">'+store.contact_email+'</a>');
  document.getElementById('footContact').innerHTML = '&copy; 2026 '+store.name_zh+(parts.length?' · '+parts.join(' · '):'');
  document.title = store.name_zh+' · Order';
  if(store.hero_image){
    var hdr = document.querySelector('.page-header');
    hdr.style.backgroundImage = 'linear-gradient(rgba(0,0,0,.50),rgba(0,0,0,.50)),url("'+store.hero_image+'")';
    hdr.style.backgroundSize = 'cover';
    hdr.style.backgroundPosition = 'center';
    hdr.style.backgroundRepeat = 'no-repeat';
  }
  if(isDemo){
    var f = document.getElementById('demoFlag');
    f.style.display = 'block';
    f.textContent = '演示模式：正在用内嵌数据。部署后会自动读取线上配置。';
  }
}

function setCat(cat){
  activeCat = (activeCat===cat) ? null : cat;
  document.querySelectorAll('.cat-tab').forEach(function(b){
    b.classList.toggle('active', b.dataset.cat===activeCat);
  });
  renderProducts();
}

function carries(p){
  if(store.drop && store.drop.indexOf(p.sku)!==-1) return false;
  if(store.add  && store.add.indexOf(p.sku)!==-1)  return true;
  return !!p.common;
}

function priceOf(p){
  var ov = store.prices ? store.prices[p.sku] : undefined;
  if(ov!==undefined && ov!==null && ov!=='') return round2(Number(ov));
  return round2(p.base_price * (store.markup||1));
}

function onSearch(q){
  q = q.trim().toLowerCase();
  var label   = document.getElementById('searchLabel');
  var catSec  = document.querySelector('.cat-tabs-section');
  if(q){
    catSec.style.display = 'none';
    label.style.display  = 'block';
    renderSearch(q);
  } else {
    catSec.style.display = '';
    label.style.display  = 'none';
    renderProducts();
  }
}

function fuzzyMatch(text, q){
    // 支持分词模糊：把搜索词按空格拆开，每段都要匹配
    var parts = q.split(/\s+/).filter(Boolean);
    return parts.every(function(part){
      return text.indexOf(part) >= 0;
    });
  }

  function renderSearch(q){
  var matches = (catalog ? catalog.products : []).filter(function(p){
    var haystack = (p.name_zh + ' ' + p.name_en + ' ' + p.sku).toLowerCase();
    return fuzzyMatch(haystack, q);
  });
  var label = document.getElementById('searchLabel');
  label.textContent = matches.length
    ? '找到 '+matches.length+' 个商品 · '+matches.length+' result'+(matches.length>1?'s':'')
    : '没有找到相关商品 · No results found';

  var col = document.getElementById('productsCol');
  col.innerHTML = '';
  matches.forEach(function(p){
    var row = document.createElement('div');
    row.className = 'product-row';
    var imgHtml = p.image_url
      ? '<img class="prod-img" src="'+p.image_url+'" alt="'+p.name_en+'" loading="lazy">'
      : '<div class="prod-img-placeholder">🛍</div>';
    row.innerHTML = imgHtml +
      '<div class="prod-info">'+
        '<h3>'+p.name_en+'</h3>'+
        '<div class="zh">'+p.name_zh+'</div>'+
        '<div class="spec">'+(p.spec||'')+'</div>'+
        '<div class="price">'+fmt(priceOf(p))+'</div>'+
      '</div>'+
      '<div class="qty-control">'+
        '<button onclick="adj(\''+p.sku+'\',-1)">−</button>'+
        '<span id="q'+p.sku+'">'+(qty[p.sku]||0)+'</span>'+
        '<button onclick="adj(\''+p.sku+'\',1)">+</button>'+
      '</div>';
    col.appendChild(row);
  });
}

function renderProducts(){
  var col = document.getElementById('productsCol');
  col.innerHTML = '';

  if(!activeCat){
    CAT_INFO.forEach(function(c){
      var card = document.createElement('div');
      card.className = 'cat-card';
      card.onclick = function(){ setCat(c.cat); };
      card.innerHTML = '<div class="cat-card-icon">'+c.icon+'</div>' +
                       '<div class="cat-card-zh">'+c.zh+'</div>' +
                       '<div class="cat-card-en">'+c.en+'</div>';
      col.appendChild(card);
    });
    return;
  }

  var back = document.createElement('div');
  back.className = 'cat-back';
  back.textContent = '\u2190 所有品类 All Categories';
  back.onclick = function(){
    activeCat = null;
    document.querySelectorAll('.cat-tab').forEach(function(b){ b.classList.remove('active'); });
    renderProducts();
  };
  col.appendChild(back);

  var count = 0;
  catalog.products.forEach(function(p){
    if(!carries(p)) return;
    if(activeCat === 'featured' ? !p.featured : p.category !== activeCat) return;
    count++;
    qty[p.sku] = qty[p.sku]||0;
    var row = document.createElement('div');
    row.className = 'product-row';
    const imgHtml = p.image_url
      ? '<img class="prod-img" src="'+p.image_url+'" alt="'+p.name_en+'" loading="lazy">'
      : '<div class="prod-img-placeholder">🛍</div>';
    row.innerHTML =
      imgHtml +
      '<div class="prod-info">' +
        '<h3>'+p.name_en+'</h3>' +
        '<div class="zh">'+p.name_zh+'</div>' +
        '<div class="spec">'+(p.spec||'')+'</div>' +
        '<div class="price">'+fmt(priceOf(p))+'</div>' +
      '</div>' +
      '<div class="qty-control">' +
        '<button class="qty-btn" data-sku="'+p.sku+'" data-d="-1">\u2212</button>' +
        '<div class="qty-num" id="q-'+p.sku+'">'+qty[p.sku]+'</div>' +
        '<button class="qty-btn" data-sku="'+p.sku+'" data-d="1">+</button>' +
      '</div>';
    col.appendChild(row);
  });

  if(count===0){
    var empty = document.createElement('div');
    empty.className = 'empty-cat';
    empty.innerHTML = '即将上架<br><span style="font-size:12px;">Coming Soon</span>';
    col.appendChild(empty);
  }
}

document.addEventListener('click', function(e){
  var btn = e.target.closest('.qty-btn');
  if(!btn) return;
  var sku = btn.dataset.sku;
  var d   = parseInt(btn.dataset.d, 10);
  if(!sku) return;
  qty[sku] = Math.max(0, (qty[sku]||0)+d);
  var el = document.getElementById('q-'+sku);
  if(el) el.textContent = qty[sku];
  updateCart();
  zipConfirmed = false;
  document.getElementById('zipInline').style.display = 'none';
  document.getElementById('zipCartMsg').style.display = 'none';
});

function updateCart(){
  var items = [], subtotal = 0, count = 0;
  catalog.products.forEach(function(p){
    var n = qty[p.sku]||0;
    if(n>0){
      var line = round2(n*priceOf(p));
      subtotal += line; count += n;
      items.push({p:p, n:n, line:line});
    }
  });
  subtotal = round2(subtotal);
  var thr = store.free_delivery_threshold!=null ? store.free_delivery_threshold : 30;
  var fee = store.delivery_fee!=null ? store.delivery_fee : 5;
  var delivery = count===0 ? 0 : (subtotal>=thr ? 0 : fee);
  var total = round2(subtotal+delivery);

  var emptyEl   = document.getElementById('cartEmpty');
  var itemsEl   = document.getElementById('cartItems');
  var totalsEl  = document.getElementById('cartTotals');
  var noteEl    = document.getElementById('cartNote');
  var btn       = document.getElementById('checkoutBtn');

  if(count===0){
    emptyEl.style.display='block'; itemsEl.innerHTML='';
    totalsEl.style.display='none'; noteEl.style.display='none';
    btn.disabled=true; return;
  }
  emptyEl.style.display='none'; totalsEl.style.display='block'; btn.disabled=false;

  itemsEl.innerHTML = items.map(function(it){
    return '<div class="cart-item"><span class="cart-item-name">'+it.p.name_zh+' x'+it.n+'</span><span class="cart-item-price">'+fmt(it.line)+'</span></div>';
  }).join('');

  document.getElementById('cartSubtotal').textContent = fmt(subtotal);
  document.getElementById('cartDelivery').innerHTML   = delivery===0 ? '<span class="free-tag">免费 Free</span>' : fmt(delivery);
  document.getElementById('cartTotal').textContent    = fmt(total);

  var need = round2(thr - subtotal);
  noteEl.style.display = 'block';
  noteEl.textContent = need>0 ? ('再加 '+fmt(need)+' 即可免费配送 · Add '+fmt(need)+' for free delivery!') : 'Free delivery applied!';
}

function goToCheckout(){
  var cart = [];
  catalog.products.forEach(function(p){ var n=qty[p.sku]||0; if(n>0) cart.push({sku:p.sku,qty:n}); });
  if(cart.length===0) return;
  if(!zipConfirmed){
    document.getElementById('zipInline').style.display = 'block';
    document.getElementById('zipCart').focus();
    return;
  }
  submitCheckout(cart);
}

function confirmZipAndProceed(){
  var z   = document.getElementById('zipCart').value.trim();
  var msg = document.getElementById('zipCartMsg');
  msg.style.display = 'block';
  if(!/^[0-9]{5}$/.test(z)){
    msg.className='zip-msg err'; msg.textContent='请输入有效的5位邮编 · Please enter a valid 5-digit ZIP.'; return;
  }
  if((store.delivery_zips||[]).indexOf(z)!==-1){
    msg.className='zip-msg ok'; msg.textContent='✓ 可配送 · Delivery available!';
    zipConfirmed = true;
    setTimeout(function(){
      document.getElementById('zipInline').style.display = 'none';
      var cart = [];
      catalog.products.forEach(function(p){ var n=qty[p.sku]||0; if(n>0) cart.push({sku:p.sku,qty:n}); });
      submitCheckout(cart);
    }, 700);
  } else {
    msg.className='zip-msg err';
    msg.textContent = 'ZIP '+z+' is outside our delivery area.' + (store.contact_email ? ' Contact: '+store.contact_email : '');
  }
}

document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && document.activeElement && document.activeElement.id==='zipCart') confirmZipAndProceed();
});

function submitCheckout(cart){
  var btn = document.getElementById('checkoutBtn');
  btn.disabled=true; btn.textContent='跳转中 Redirecting…';
  fetch(CHECKOUT_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({storeId:store.store_id, cart:cart, origin:window.location.origin})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d && d.url){ location.href = d.url; }
    else { alert('结账暂时无法完成 · ' + ((d&&d.error)||'请稍后再试')); resetBtn(); }
  })
  .catch(function(){ alert('结账暂时无法完成，请稍后再试。'); resetBtn(); });
  function resetBtn(){ btn.disabled=false; btn.textContent='去结账 Checkout \u2192'; }
}

boot();
</script>
