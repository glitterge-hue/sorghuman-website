<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorghuman 管理后台 · 登录</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#f0f4f0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:#fff;border-radius:10px;padding:40px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.08);}
.logo{text-align:center;margin-bottom:28px;}
.logo h1{font-size:22px;color:#1A4A28;font-weight:700;}
.logo p{font-size:13px;color:#6B6B62;margin-top:4px;}
label{display:block;font-size:13px;font-weight:500;color:#333;margin-bottom:6px;margin-top:16px;}
input{width:100%;border:1px solid #ddd;border-radius:6px;padding:10px 14px;font-size:14px;font-family:inherit;outline:none;}
input:focus{border-color:#2A6B3A;}
.btn{width:100%;background:#2A6B3A;color:#fff;border:none;border-radius:6px;padding:12px;font-size:15px;font-family:inherit;font-weight:600;cursor:pointer;margin-top:24px;}
.btn:hover{background:#1A5A2A;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{margin-top:14px;font-size:13px;text-align:center;padding:10px;border-radius:6px;}
.msg.err{background:#fdf2f2;color:#c0392b;}
.msg.ok{background:#f0f7f2;color:#1A4A28;}
.divider{height:1px;background:#eee;margin:20px 0;}
h2{font-size:16px;color:#1A4A28;margin-bottom:4px;}
small{color:#888;font-size:12px;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>🌾 Sorghuman Admin</h1>
    <p>高仁控股 · 管理后台</p>
  </div>

  <!-- 设置新密码（邮件链接跳转后显示）-->
  <div id="resetBox" style="display:none;">
    <h2>设置新密码</h2>
    <small>Set your admin password</small>
    <label>新密码 New Password</label>
    <input type="password" id="newPwd" placeholder="至少8位">
    <label>确认密码 Confirm</label>
    <input type="password" id="newPwd2" placeholder="再输一次">
    <button class="btn" onclick="setPassword()">确认设置 Set Password</button>
    <div id="resetMsg" class="msg" style="display:none;"></div>
  </div>

  <!-- 正常登录 -->
  <div id="loginBox">
    <label>邮箱 Email</label>
    <input type="email" id="email" placeholder="admin@sorghuman.com">
    <label>密码 Password</label>
    <input type="password" id="password" placeholder="密码">
    <button class="btn" id="loginBtn" onclick="login()">登录 Sign In</button>
    <div id="loginMsg" class="msg" style="display:none;"></div>
    <div class="divider"></div>
    <button class="btn" style="background:#fff;color:#2A6B3A;border:1px solid #2A6B3A;margin-top:0;" onclick="sendReset()">忘记密码 Forgot Password</button>
    <div id="resetSentMsg" class="msg" style="display:none;"></div>
  </div>
</div>

<script>
// 从 Netlify 函数读取配置（避免硬编码 key 触发安全扫描）
let sb;
async function initSupabase(){
  const cfg = await fetch('/.netlify/functions/get-config').then(r=>r.json());
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {
    auth: { flowType: 'pkce', detectSessionInUrl: false, persistSession: true, autoRefreshToken: true }
  });
}

// 显示「设置新密码」界面
function showResetBox(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('resetBox').style.display = 'block';
}

// 处理密码重置链接回跳：兼容新版 PKCE(?code=)、旧版(#access_token)，并友好提示链接过期
window.addEventListener('load', async () => {
  await initSupabase();

  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const query      = new URLSearchParams(window.location.search);
  const loginMsg   = document.getElementById('loginMsg');

  // 1) 链接里带错误（过期/失效等）→ 友好提示，不再静默失败
  if (hashParams.get('error_code') || hashParams.get('error') || query.get('error_code')) {
    showMsg(loginMsg, '重置链接无效或已过期，请重新点「忘记密码」获取新链接。', 'err');
    history.replaceState(null, '', location.pathname);
    return;
  }

  // 2) 新版 PKCE 流程：URL 带 ?code=，兑换成会话
  if (query.get('code')) {
    const { error } = await sb.auth.exchangeCodeForSession(window.location.href);
    history.replaceState(null, '', location.pathname);
    if (error) { showMsg(loginMsg, '重置链接无效或已过期，请重新获取。', 'err'); return; }
    showResetBox();   // 带 code 进到本页的只可能是密码重置
    return;
  }

  // 3) 旧版 implicit 流程：hash 里带 access_token
  if (hashParams.get('access_token')) {
    await sb.auth.setSession({
      access_token : hashParams.get('access_token'),
      refresh_token: hashParams.get('refresh_token') || ''
    });
    history.replaceState(null, '', location.pathname);
    showResetBox();
    return;
  }

  // 4) 已登录直接进产品页
  const { data: { session } } = await sb.auth.getSession();
  if (session) location.href = 'products.html';
});

async function login() {
  const email = document.getElementById('email').value.trim();
  const pwd   = document.getElementById('password').value;
  const btn   = document.getElementById('loginBtn');
  const msg   = document.getElementById('loginMsg');
  if (!email || !pwd) { showMsg(msg,'请填写邮箱和密码','err'); return; }
  btn.disabled = true; btn.textContent = '登录中…';
  const { error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error) { showMsg(msg, error.message, 'err'); btn.disabled=false; btn.textContent='登录 Sign In'; }
  else location.href = 'products.html';
}

async function setPassword() {
  const p1  = document.getElementById('newPwd').value;
  const p2  = document.getElementById('newPwd2').value;
  const msg = document.getElementById('resetMsg');
  if (p1.length < 8)    { showMsg(msg,'密码至少8位','err'); return; }
  if (p1 !== p2)        { showMsg(msg,'两次密码不一致','err'); return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) showMsg(msg, error.message, 'err');
  else { showMsg(msg,'密码设置成功！正在跳转…','ok'); setTimeout(() => location.href='products.html', 1500); }
}

async function sendReset() {
  const email = document.getElementById('email').value.trim();
  const msg   = document.getElementById('resetSentMsg');
  if (!email) { showMsg(msg,'请先填写邮箱','err'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://sorghuman.com/manage/'
  });
  if (error) showMsg(msg, error.message, 'err');
  else showMsg(msg,'重置邮件已发送，请检查邮箱','ok');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

function showMsg(el, text, type) {
  el.textContent = text; el.className = 'msg ' + type; el.style.display = 'block';
}
</script>
</body>
</html>
