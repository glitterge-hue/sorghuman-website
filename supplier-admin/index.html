<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>供应商管理 Supplier Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f0f4f0;color:#1a1a18;min-height:100vh;}
.topbar{background:#14352C;color:#fff;padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar .brand{font-size:15px;font-weight:700;}
.topbar .sub{font-size:13px;color:rgba(255,255,255,.75);}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e0ddd5;padding:0 20px;}
.tab{padding:14px 18px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:#888;}
.tab.active{color:#14352C;border-bottom-color:#14352C;}
.main{max-width:940px;margin:0 auto;padding:20px;}
.panel{display:none;} .panel.active{display:block;}
.card{background:#fff;border-radius:8px;border:1px solid #e8e8e0;overflow:hidden;margin-bottom:16px;}
.card-header{padding:14px 18px;font-size:13px;font-weight:600;color:#555;background:#f8f8f5;border-bottom:1px solid #e8e8e0;display:flex;justify-content:space-between;align-items:center;}
.search-bar{padding:14px 18px;border-bottom:1px solid #f0f0ea;display:flex;gap:8px;flex-wrap:wrap;}
.search-bar input,.search-bar select{border:1px solid #ddd;border-radius:6px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none;}
.prod-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #f5f5f0;}
.prod-img{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#f0f0ea;flex-shrink:0;}
.prod-img-ph{width:48px;height:48px;border-radius:6px;background:#f0f0ea;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.prod-info{flex:1;min-width:0;}
.prod-info .zh{font-size:14px;font-weight:500;} .prod-info .en{font-size:12px;color:#888;}
.prod-info .spec{font-size:11px;color:#aaa;}
.mini{width:72px;border:1px solid #ddd;border-radius:5px;padding:5px 6px;font-size:12px;text-align:right;font-family:inherit;}
.mini-lbl{font-size:10px;color:#aaa;display:block;text-align:center;}
.btn{padding:7px 16px;border-radius:6px;border:none;font-size:13px;font-family:inherit;font-weight:500;cursor:pointer;}
.btn-primary{background:#2A6B3A;color:#fff;} .btn-primary:disabled{opacity:.5;}
.btn-danger{background:#fff;color:#c0392b;border:1px solid #e8a0a0;}
.btn-sm{padding:4px 12px;font-size:12px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px;}
.form-group{display:flex;flex-direction:column;gap:5px;} .form-group.full{grid-column:1/-1;}
.form-group label{font-size:12px;font-weight:600;color:#555;}
.form-group input,.form-group select{border:1px solid #ddd;border-radius:6px;padding:8px 12px;font-size:13px;font-family:inherit;}
.form-group .hint{font-size:11px;color:#aaa;}
.save-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e0ddd5;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -2px 8px rgba(0,0,0,.06);}
.empty{text-align:center;padding:40px;color:#aaa;font-size:14px;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-box{background:#fff;border-radius:10px;padding:36px 32px;width:360px;box-shadow:0 4px 20px rgba(0,0,0,.08);}
.login-box h2{font-size:20px;color:#14352C;margin-bottom:6px;}
.login-box p{font-size:13px;color:#888;margin-bottom:24px;}
.err{color:#c0392b;font-size:13px;margin-top:10px;}
.po-card{background:#fff;border:1px solid #e8e8e0;border-radius:8px;padding:14px 18px;margin-bottom:12px;}
.po-status{padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;}
.st-submitted{background:#fff4e0;color:#b57500;} .st-confirmed{background:#e6f0ff;color:#1a5fb4;}
.st-shipped{background:#eaf2ec;color:#2A6B3A;} .st-received{background:#f0f0ea;color:#666;}
.st-cancelled{background:#fbe9e7;color:#c0392b;}
.tag{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;background:#f0f0ea;color:#666;}
input[type=checkbox]{width:16px;height:16px;accent-color:#2A6B3A;cursor:pointer;flex-shrink:0;}
@media(max-width:600px){ .form-grid{grid-template-columns:1fr;} .form-group.full{grid-column:1;} .tabs .tab{padding:12px 10px;font-size:12px;} }
</style>
</head>
<body>

<div id="loginWrap" class="login-wrap">
  <div class="login-box">
    <h2>🚚 供应商管理 Supplier</h2>
    <p>请输入供应商 ID 和访问令牌</p>
    <div class="form-group"><label>供应商 ID</label><input id="inSid" placeholder="例如：sorghuman"></div>
    <div class="form-group" style="margin-top:12px;"><label>访问令牌 Token</label><input id="inTok" type="password"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:16px;padding:10px;" onclick="doLogin()">登录 Login</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<div id="mainWrap" style="display:none;">
  <div class="topbar">
    <div><div class="brand">🚚 Sorghuman 供应商后台</div><div class="sub" id="supName"></div></div>
    <button class="btn" style="background:rgba(255,255,255,.15);color:#fff;font-size:12px;" onclick="sessionStorage.clear();location.reload();">退出</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('items')">📦 我的供货商品</div>
    <div class="tab" onclick="showTab('add')">➕ 上架商品</div>
    <div class="tab" onclick="showTab('accounts')">🏪 门店开户 <span id="acctBadge" style="color:#c0392b;"></span></div>
    <div class="tab" onclick="showTab('pos')">📄 收到的补货单 <span id="poBadge" style="color:#c0392b;"></span></div>
    <div class="tab" onclick="showTab('profile')">⚙️ 交易条件</div>
  </div>

  <div class="main">
    <!-- ① 我的供货商品 -->
    <div id="panelItems" class="panel active">
      <div class="card">
        <div class="card-header"><span>供货目录 <span id="itemCount" style="color:#888;font-weight:400;"></span></span>
          <span style="font-weight:400;color:#888;font-size:12px;">改完记得点底部保存</span></div>
        <div class="search-bar"><input id="itemSearch" placeholder="搜索…" oninput="renderItems()" style="flex:1;"></div>
        <div id="itemList"><div class="empty">加载中…</div></div>
      </div>
      <div class="save-bar"><span id="dirtyMsg">无改动</span>
        <button class="btn btn-primary" onclick="saveItems()">保存 Save</button></div>
    </div>

    <!-- ② 上架商品 -->
    <div id="panelAdd" class="panel">
      <div class="card">
        <div class="card-header">从总商品库选品上架</div>
        <div class="search-bar"><input id="catSearch" placeholder="搜索商品库…" oninput="renderCatalog()" style="flex:1;"></div>
        <div id="catList"><div class="empty">加载中…</div></div>
      </div>
      <div class="card">
        <div class="card-header">商品库里没有？直接上新品（全网门店都能订）</div>
        <div class="form-grid">
          <div class="form-group"><label>SKU *</label><input id="nSku" placeholder="SG-DUMP-001"></div>
          <div class="form-group"><label>中文名 *</label><input id="nZh"></div>
          <div class="form-group"><label>英文名</label><input id="nEn"></div>
          <div class="form-group"><label>规格</label><input id="nSpec" placeholder="500g / 袋"></div>
          <div class="form-group"><label>品类</label>
            <select id="nCat">
              <option value="frozen">冷冻食品</option><option value="grains">米面粮油</option>
              <option value="condiments">调味品</option><option value="beverage">饮料</option>
              <option value="snacks">零食</option><option value="grocery">杂货</option>
            </select></div>
          <div class="form-group"><label>建议零售价 $</label><input id="nBase" type="number" step="0.01"><span class="hint">门店上架时的默认售价</span></div>
          <div class="form-group"><label>箱价 $ *</label><input id="nCase" type="number" step="0.01"></div>
          <div class="form-group"><label>每箱件数</label><input id="nUpc" type="number" value="12"></div>
          <div class="form-group full"><label>图片 URL</label><input id="nImg" placeholder="/images/xxx.jpg"></div>
          <div class="form-group full"><button class="btn btn-primary" onclick="addNewProduct()">上新品 Add</button></div>
        </div>
      </div>
    </div>

    <!-- ③ 门店开户审核 -->
    <div id="panelAccounts" class="panel">
      <div class="card">
        <div class="card-header"><span>门店账户</span>
          <span style="font-weight:400;color:#888;font-size:12px;">只有批准的门店才看得到你的价格</span></div>
        <div id="acctList"><div class="empty">加载中…</div></div>
      </div>
      <div class="card">
        <div class="card-header">主动给老客户开户（线下已在供货的店，不用等他申请）</div>
        <div class="search-bar">
          <select id="inviteStore" style="flex:1;"><option value="">选择门店…</option></select>
          <select id="inviteTerms"><option>COD</option><option>NET15</option><option>NET30</option></select>
          <input id="inviteLimit" type="number" placeholder="账期额度 $（留空=不限）" style="width:180px;">
          <button class="btn btn-primary btn-sm" onclick="inviteStore()">直接开户</button>
        </div>
      </div>
    </div>

    <!-- ④ 补货单 -->
    <div id="panelPos" class="panel"><div id="poList"><div class="empty">加载中…</div></div></div>

    <!-- ④ 交易条件 -->
    <div id="panelProfile" class="panel">
      <div class="card">
        <div class="card-header">交易条件（门店在补货页会看到这些）</div>
        <div class="form-grid">
          <div class="form-group"><label>起送金额 $</label><input id="pMin" type="number" step="1"><span class="hint">0 = 不限</span></div>
          <div class="form-group"><label>送货费 $</label><input id="pFee" type="number" step="0.01"></div>
          <div class="form-group"><label>满额免运费 $</label><input id="pFree" type="number" step="1"><span class="hint">留空 = 从不免</span></div>
          <div class="form-group"><label>交货天数</label><input id="pLead" type="number"></div>
          <div class="form-group"><label>付款条件</label>
            <select id="pTerms"><option>COD</option><option>NET15</option><option>NET30</option></select></div>
          <div class="form-group"><label>每周送货日</label><input id="pDays" placeholder="Tue,Fri"></div>
          <div class="form-group full"><label>服务州（逗号分隔，留空 = 全境）</label><input id="pStates" placeholder="PA,NY,NJ"></div>
          <div class="form-group full"><label>服务邮编（可选，比州更精确）</label><input id="pZips" placeholder="18015,18018"></div>
          <div class="form-group"><label>联系人</label><input id="pContact"></div>
          <div class="form-group"><label>电话</label><input id="pPhone"></div>
        </div>
        <div style="padding:0 18px 18px;display:flex;justify-content:flex-end;">
          <button class="btn btn-primary" onclick="saveProfile()">保存 Save</button></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '/.netlify/functions/supplier-portal';
let sid='', tok='', sup=null, items=[], catalog=[], pos=[];
const dirty = new Set(), removed = new Set();

async function api(action, extra){
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action, supplierId: sid, token: tok, ...(extra||{}) }) });
  return r.json();
}
const money = n => '$'+(Number(n)||0).toFixed(2);

async function doLogin(){
  const a = document.getElementById('inSid').value.trim();
  const b = document.getElementById('inTok').value.trim();
  if(!a||!b) return;
  sid=a; tok=b;
  const res = await api('GET_MY_ITEMS');
  if(res.error){ document.getElementById('loginErr').textContent='登录失败：'+res.error; return; }
  sup = res.supplier; items = res.items || [];
  sessionStorage.setItem('supId',sid); sessionStorage.setItem('supTok',tok);
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('mainWrap').style.display='block';
  document.getElementById('supName').textContent = sup.name_zh + (sup.name_en?' / '+sup.name_en:'');
  renderItems(); fillProfile(); loadPos(); loadAccounts();
}
window.addEventListener('load', ()=>{
  const p = new URLSearchParams(location.search);
  const a = p.get('supplier') || sessionStorage.getItem('supId');
  const b = p.get('token')    || sessionStorage.getItem('supTok');
  if(a) document.getElementById('inSid').value = a;
  if(b) document.getElementById('inTok').value = b;
  if(a&&b) doLogin();
});

function showTab(name){
  const names=['items','add','accounts','pos','profile'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', names[i]===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel'+name.charAt(0).toUpperCase()+name.slice(1)).classList.add('active');
  if(name==='add' && !catalog.length) loadCatalog();
  if(name==='accounts') loadAccounts();
  if(name==='pos') loadPos();
}

// ── 我的供货商品 ──────────────────────────────────────────────
function markDirty(sku, field, val){
  const it = items.find(i=>i.sku===sku); if(!it) return;
  it[field] = val; dirty.add(sku);
  document.getElementById('dirtyMsg').textContent = dirty.size+' 项待保存';
}
function renderItems(){
  const q = (document.getElementById('itemSearch').value||'').toLowerCase();
  const list = items.filter(i=>i.products && (!q || (i.products.name_zh+i.sku).toLowerCase().includes(q)));
  document.getElementById('itemCount').textContent = '('+items.length+')';
  document.getElementById('itemList').innerHTML = list.length ? list.map(i=>{
    const p = i.products;
    const unit = i.units_per_case>0 ? i.case_price/i.units_per_case : i.case_price;
    const img = p.image_url ? `<img class="prod-img" src="${p.image_url}">` : '<div class="prod-img-ph">📦</div>';
    return `<div class="prod-row">
      ${img}
      <div class="prod-info">
        <div class="zh">${p.name_zh}</div>
        <div class="en">${p.name_en||''} <span class="spec">${p.spec||''}</span></div>
        <div class="spec">${i.sku} · 单件成本 ${money(unit)} · 门店建议售价 ${money(p.base_price)}</div>
      </div>
      <div><span class="mini-lbl">箱价 $</span>
        <input class="mini" type="number" step="0.01" value="${i.case_price}" onchange="markDirty('${i.sku}','case_price',this.value)"></div>
      <div><span class="mini-lbl">件/箱</span>
        <input class="mini" type="number" value="${i.units_per_case}" onchange="markDirty('${i.sku}','units_per_case',this.value)"></div>
      <div><span class="mini-lbl">起订箱</span>
        <input class="mini" type="number" value="${i.moq||1}" onchange="markDirty('${i.sku}','moq',this.value)"></div>
      <div><span class="mini-lbl">库存</span>
        <select class="mini" style="width:78px;text-align:left;" onchange="markDirty('${i.sku}','stock_status',this.value)">
          <option value="in_stock" ${i.stock_status==='in_stock'?'selected':''}>有货</option>
          <option value="low"      ${i.stock_status==='low'?'selected':''}>少量</option>
          <option value="out"      ${i.stock_status==='out'?'selected':''}>缺货</option>
        </select></div>
      <button class="btn btn-danger btn-sm" onclick="dropItem('${i.sku}')">下架</button>
    </div>`;
  }).join('') : '<div class="empty">还没有供货商品，去「上架商品」选品</div>';
}
function dropItem(sku){
  if(!confirm('下架后门店将无法从你这里订购该商品')) return;
  removed.add(sku); dirty.delete(sku);
  items = items.filter(i=>i.sku!==sku);
  renderItems();
  document.getElementById('dirtyMsg').textContent = (dirty.size+removed.size)+' 项待保存';
}
async function saveItems(){
  const payload = items.filter(i=>dirty.has(i.sku)).map(i=>({
    sku:i.sku, case_price:i.case_price, units_per_case:i.units_per_case,
    moq:i.moq, stock_status:i.stock_status, note:i.note, active:true,
  }));
  const res = await api('SAVE_ITEMS', { items: payload, remove: [...removed] });
  if(res.error){ alert('保存失败：'+res.error); return; }
  dirty.clear(); removed.clear();
  document.getElementById('dirtyMsg').textContent = '✅ 已保存';
}

// ── 选品上架 ──────────────────────────────────────────────────
async function loadCatalog(){
  const res = await api('GET_ALL_PRODUCTS');
  catalog = res.products || [];
  renderCatalog();
}
function renderCatalog(){
  const q = (document.getElementById('catSearch').value||'').toLowerCase();
  const have = new Set(items.map(i=>i.sku));
  const list = catalog.filter(p=>!have.has(p.sku) && (!q || (p.name_zh+p.sku).toLowerCase().includes(q)));
  document.getElementById('catList').innerHTML = list.length ? list.map(p=>`
    <div class="prod-row">
      ${p.image_url?`<img class="prod-img" src="${p.image_url}">`:'<div class="prod-img-ph">📦</div>'}
      <div class="prod-info">
        <div class="zh">${p.name_zh}</div>
        <div class="en">${p.name_en||''} <span class="spec">${p.spec||''}</span></div>
        <div class="spec">${p.sku} · 门店建议零售 ${money(p.base_price)}</div>
      </div>
      <div><span class="mini-lbl">箱价 $</span><input class="mini" id="cp_${p.sku}" type="number" step="0.01" placeholder="0.00"></div>
      <div><span class="mini-lbl">件/箱</span><input class="mini" id="cu_${p.sku}" type="number" value="12"></div>
      <button class="btn btn-primary btn-sm" onclick="listItem('${p.sku}')">上架</button>
    </div>`).join('') : '<div class="empty">没有可上架的商品</div>';
}
async function listItem(sku){
  const cp = parseFloat(document.getElementById('cp_'+sku).value);
  const cu = parseInt(document.getElementById('cu_'+sku).value) || 1;
  if(!cp || cp<=0){ alert('请填箱价'); return; }
  const res = await api('SAVE_ITEMS', { items:[{ sku, case_price:cp, units_per_case:cu, moq:1, stock_status:'in_stock' }] });
  if(res.error){ alert(res.error); return; }
  const r = await api('GET_MY_ITEMS'); items = r.items || [];
  renderCatalog(); renderItems();
}
async function addNewProduct(){
  const b = {
    sku: v('nSku'), name_zh: v('nZh'), name_en: v('nEn'), spec: v('nSpec'),
    category: v('nCat'), base_price: v('nBase'), image_url: v('nImg'),
    case_price: v('nCase'), units_per_case: v('nUpc') || 12, moq: 1,
  };
  if(!b.sku || !b.name_zh || !b.case_price){ alert('SKU、中文名、箱价必填'); return; }
  const res = await api('ADD_NEW_PRODUCT', b);
  if(res.error){ alert('失败：'+res.error); return; }
  alert('✅ 已上新品，全网门店都能在补货页看到');
  ['nSku','nZh','nEn','nSpec','nBase','nCase','nImg'].forEach(id=>document.getElementById(id).value='');
  const r = await api('GET_MY_ITEMS'); items = r.items || []; catalog = [];
  renderItems();
}
const v = id => document.getElementById(id).value.trim();

// ── 补货单 ────────────────────────────────────────────────────
const ST = { submitted:['待确认','st-submitted'], confirmed:['已确认','st-confirmed'],
             shipped:['已发货','st-shipped'], received:['门店已收货','st-received'],
             cancelled:['已取消','st-cancelled'] };
async function loadPos(){
  const res = await api('GET_POS');
  pos = res.pos || [];
  const pending = pos.filter(p=>p.status==='submitted').length;
  document.getElementById('poBadge').textContent = pending ? '('+pending+')' : '';
  const box = document.getElementById('poList');
  if(!pos.length){ box.innerHTML='<div class="empty">还没有收到补货单</div>'; return; }
  box.innerHTML = pos.map(p=>{
    const [label, cls] = ST[p.status] || [p.status,'st-received'];
    const s = p.stores || {};
    const lines = (p.items||[]).map(l=>
      `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;">
        <span>${l.name_zh} <span class="tag">${l.cases} 箱 × ${l.units_per_case} 件</span></span>
        <span>${money(l.line_total)}</span></div>`).join('');
    let act = '';
    if(p.status==='submitted')
      act = `<button class="btn btn-primary btn-sm" onclick="updPo('${p.id}','confirmed')">确认接单</button>
             <button class="btn btn-danger btn-sm" onclick="updPo('${p.id}','cancelled')">拒单</button>`;
    else if(p.status==='confirmed')
      act = `<button class="btn btn-primary btn-sm" onclick="updPo('${p.id}','shipped')">标记已发货</button>`;
    return `<div class="po-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
        <div><b>${p.po_number}</b> <span class="tag">${s.name_zh||p.store_id}</span></div>
        <span class="po-status ${cls}">${label}</span>
      </div>
      <div style="font-size:12px;color:#888;margin-bottom:8px;">
        📍 ${s.address||'—'}${s.city?', '+s.city:''} ${s.state||''} ${s.zip||''}
        ${s.contact_phone?' · ☎️ '+s.contact_phone:''}
        ${p.store_note?'<br>门店备注：<b>'+p.store_note+'</b>':''}
      </div>
      ${lines}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid #f0f0ea;">
        <span style="font-size:12px;color:#888;">${new Date(p.created_at).toLocaleDateString('zh-CN')} · 预计 ${p.expected_date||'—'} 送达</span>
        <span><b style="color:#2A6B3A;margin-right:10px;">${money(p.total)}</b>${act}</span>
      </div>
    </div>`;
  }).join('');
}
async function updPo(poId, status){
  let note;
  if(status==='cancelled'){ note = prompt('拒单原因（门店会看到）'); if(note===null) return; }
  const res = await api('UPDATE_PO', { poId, status, supplier_note: note });
  if(res.error){ alert(res.error); return; }
  loadPos();
}

// ── 门店开户审核 ──────────────────────────────────────────────
const AST = { pending:['待审核','st-submitted'], approved:['已开户','st-shipped'],
              rejected:['已拒绝','st-cancelled'], suspended:['已停单','st-cancelled'] };
let accounts = [];

async function loadAccounts(){
  const res = await api('GET_STORE_ACCOUNTS');
  accounts = res.accounts || [];
  const pend = accounts.filter(a=>a.status==='pending').length;
  document.getElementById('acctBadge').textContent = pend ? '('+pend+')' : '';

  const box = document.getElementById('acctList');
  box.innerHTML = accounts.length ? accounts.map(a=>{
    const s = a.stores || {};
    const [label, cls] = AST[a.status] || [a.status,'st-received'];
    let act = '';
    if(a.status==='pending')
      act = `<button class="btn btn-primary btn-sm" onclick="review('${a.store_id}','approved')">批准开户</button>
             <button class="btn btn-danger btn-sm" onclick="review('${a.store_id}','rejected')">拒绝</button>`;
    else if(a.status==='approved')
      act = `<button class="btn btn-sm" style="background:#f0f0ea;" onclick="review('${a.store_id}','approved')">改条件</button>
             <button class="btn btn-danger btn-sm" onclick="review('${a.store_id}','suspended')">停单</button>`;
    else
      act = `<button class="btn btn-primary btn-sm" onclick="review('${a.store_id}','approved')">恢复开户</button>`;

    const over = a.credit_limit!=null && a.open_amount > Number(a.credit_limit);
    return `<div class="prod-row">
      <div class="prod-img-ph">🏪</div>
      <div class="prod-info">
        <div class="zh">${s.name_zh||a.store_id} <span class="po-status ${cls}">${label}</span></div>
        <div class="en">${s.address||''} ${s.city||''} ${s.state||''} ${s.zip||''}</div>
        <div class="spec">
          ${s.contact_name||''} ${s.contact_phone||''}
          ${a.payment_terms?' · <b>'+a.payment_terms+'</b>':''}
          ${a.credit_limit!=null?' · 额度 '+money(a.credit_limit):' · 额度不限'}
          · 未结 <b style="color:${over?'#c0392b':'#666'};">${money(a.open_amount)}</b>
          ${a.apply_note?'<br>申请留言：'+a.apply_note:''}
          ${a.supplier_note?'<br>内部备注：'+a.supplier_note:''}
        </div>
      </div>
      <span style="white-space:nowrap;">${act}</span>
    </div>`;
  }).join('') : '<div class="empty">还没有门店申请开户</div>';

  // 可主动开户的门店
  const inv = await api('GET_INVITABLE_STORES');
  document.getElementById('inviteStore').innerHTML = '<option value="">选择门店…</option>' +
    (inv.stores||[]).map(x=>`<option value="${x.store_id}">${x.name_zh} · ${x.city||''} ${x.state||''}</option>`).join('');
}

async function review(store_id, status){
  let payment_terms, credit_limit, supplier_note;
  if(status==='approved'){
    payment_terms = prompt('付款条件：COD（款到发货）/ NET15 / NET30', 'NET15');
    if(payment_terms===null) return;
    const cl = prompt('账期额度 $（未结货款超过这个数就下不了新单；留空 = 不限）', '3000');
    if(cl===null) return;
    credit_limit = cl.trim()==='' ? null : cl.trim();
  } else {
    supplier_note = prompt(status==='suspended' ? '停单原因（内部备注）' : '拒绝原因（内部备注）', '');
    if(supplier_note===null) return;
  }
  const res = await api('REVIEW_STORE', { store_id, status, payment_terms, credit_limit, supplier_note });
  if(res.error){ alert(res.error); return; }
  loadAccounts();
}

async function inviteStore(){
  const store_id = document.getElementById('inviteStore').value;
  if(!store_id){ alert('请选择门店'); return; }
  const cl = document.getElementById('inviteLimit').value.trim();
  const res = await api('REVIEW_STORE', {
    store_id, status:'approved',
    payment_terms: document.getElementById('inviteTerms').value,
    credit_limit : cl==='' ? null : cl,
  });
  if(res.error){ alert(res.error); return; }
  alert('✅ 已开户，该门店下次进补货页就能看到你的价格');
  document.getElementById('inviteLimit').value='';
  loadAccounts();
}

// ── 交易条件 ──────────────────────────────────────────────────
function fillProfile(){
  const g = id => document.getElementById(id);
  g('pMin').value   = sup.min_order ?? 0;
  g('pFee').value   = sup.delivery_fee ?? 0;
  g('pFree').value  = sup.free_delivery_threshold ?? '';
  g('pLead').value  = sup.lead_time_days ?? 3;
  g('pTerms').value = sup.payment_terms || 'COD';
  g('pDays').value  = (sup.delivery_days||[]).join(',');
  g('pStates').value= (sup.service_states||[]).join(',');
  g('pZips').value  = (sup.service_zips||[]).join(',');
  g('pContact').value = sup.contact_name || '';
  g('pPhone').value   = sup.phone || '';
}
const split = s => s.split(',').map(x=>x.trim()).filter(Boolean);
async function saveProfile(){
  const res = await api('SAVE_PROFILE', {
    min_order: v('pMin'), delivery_fee: v('pFee'),
    free_delivery_threshold: v('pFree') || null, lead_time_days: v('pLead'),
    payment_terms: v('pTerms'),
    delivery_days : split(v('pDays')),
    service_states: split(v('pStates')).map(s=>s.toUpperCase()),
    service_zips  : split(v('pZips')),
    contact_name: v('pContact'), phone: v('pPhone'),
  });
  if(res.error){ alert('保存失败：'+res.error); return; }
  alert('✅ 已保存');
  const r = await api('GET_MY_ITEMS'); sup = r.supplier;
}
</script>
