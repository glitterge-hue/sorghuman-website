<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>订单查询 · Sorghuman Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#f0f4f0;color:#1a1a18;}
.topbar{background:#1A4A28;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;position:sticky;top:0;z-index:100;}
.topbar h1{font-size:16px;font-weight:700;}
.topbar nav a{color:rgba(255,255,255,.75);text-decoration:none;font-size:13px;margin-left:20px;}
.topbar nav a:hover,.topbar nav a.active{color:#fff;}
.topbar .user{font-size:12px;color:rgba(255,255,255,.65);margin-left:20px;cursor:pointer;}
.main{max-width:1100px;margin:0 auto;padding:24px;}
.stats{display:flex;gap:14px;margin-bottom:18px;}
.stat-card{background:#fff;border-radius:8px;padding:14px 20px;flex:1;border:1px solid #e8e8e0;}
.stat-card .num{font-size:26px;font-weight:700;color:#2A6B3A;}
.stat-card .lbl{font-size:12px;color:#888;margin-top:2px;}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
.toolbar select,.toolbar input{border:1px solid #ddd;border-radius:6px;padding:8px 12px;font-size:13px;font-family:inherit;outline:none;background:#fff;}
.toolbar select:focus,.toolbar input:focus{border-color:#2A6B3A;}
.table-wrap{background:#fff;border-radius:8px;border:1px solid #e8e8e0;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:#f8f8f5;}
thead th{padding:11px 14px;text-align:left;font-weight:600;color:#555;border-bottom:1px solid #e8e8e0;white-space:nowrap;}
tbody tr{border-bottom:1px solid #f0f0ea;cursor:pointer;}
tbody tr:hover{background:#fafaf7;}
td{padding:10px 14px;vertical-align:middle;}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;}
.badge-pending{background:#fff8e8;color:#8a6d1f;}
.badge-paid{background:#f0f7f2;color:#2A6B3A;}
.badge-cancelled{background:#fdf2f2;color:#c0392b;}
.price{font-variant-numeric:tabular-nums;font-weight:600;}
/* 详情弹窗 */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:10px;padding:28px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}
.modal h2{font-size:17px;color:#1A4A28;margin-bottom:16px;}
.detail-row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid #f0f0ea;}
.detail-row:last-child{border-bottom:none;}
.detail-label{color:#888;flex-shrink:0;width:100px;}
.item-list{margin-top:12px;}
.item-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #f5f5f0;}
.modal-footer{margin-top:20px;display:flex;justify-content:flex-end;gap:10px;}
.btn{padding:8px 18px;border-radius:6px;border:none;font-size:13px;font-family:inherit;font-weight:500;cursor:pointer;}
.btn-secondary{background:#fff;color:#2A6B3A;border:1px solid #2A6B3A;}
.btn-paid{background:#2A6B3A;color:#fff;}
.pagination{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:18px;}
.page-btn{padding:6px 14px;border:1px solid #ddd;border-radius:6px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit;}
.page-btn:hover{border-color:#2A6B3A;color:#2A6B3A;}
.page-btn:disabled{opacity:.4;cursor:not-allowed;}
.page-info{font-size:13px;color:#888;}
</style>
</head>
<body>

<div class="topbar">
  <h1>🌾 Sorghuman Admin</h1>
  <nav>
    <a href="products.html">商品管理</a>
    <a href="stores.html">门店管理</a>
    <a href="orders.html" class="active">订单查询</a>
  </nav>
  <span class="user" id="userEmail" onclick="logout()">退出登录</span>
</div>

<div class="main">
  <div class="stats">
    <div class="stat-card"><div class="num" id="statTotal">-</div><div class="lbl">全部订单</div></div>
    <div class="stat-card"><div class="num" id="statPaid">-</div><div class="lbl">已付款</div></div>
    <div class="stat-card"><div class="num" id="statPending">-</div><div class="lbl">待付款</div></div>
    <div class="stat-card"><div class="num" id="statRevenue">-</div><div class="lbl">总收入</div></div>
  </div>

  <div class="toolbar">
    <select id="storeFilter" onchange="load()">
      <option value="">全部门店</option>
    </select>
    <select id="statusFilter" onchange="load()">
      <option value="">全部状态</option>
      <option value="pending">待付款</option>
      <option value="paid">已付款</option>
      <option value="cancelled">已取消</option>
    </select>
    <input type="date" id="dateFrom" onchange="load()">
    <input type="date" id="dateTo" onchange="load()">
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>时间</th>
          <th>门店</th>
          <th>商品</th>
          <th>小计</th>
          <th>配送费</th>
          <th>合计</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="orderTbody">
        <tr><td colspan="8" style="text-align:center;padding:30px;color:#888;">加载中…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <button class="page-btn" id="btnPrev" onclick="prevPage()" disabled>← 上一页</button>
    <span class="page-info" id="pageInfo"></span>
    <button class="page-btn" id="btnNext" onclick="nextPage()">下一页 →</button>
  </div>
</div>

<!-- 订单详情弹窗 -->
<div class="overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="modal">
    <h2>订单详情</h2>
    <div id="detailContent"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeDetailDirect()">关闭</button>
      <button class="btn btn-paid" id="markPaidBtn" onclick="markPaid()" style="display:none;">标记为已付款</button>
    </div>
  </div>
</div>

<script>
const PAGE_SIZE = 20;
let sb, currentPage = 0, totalCount = 0, currentOrderId = null;

window.addEventListener('load', async () => {
  await initSupabase();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = 'index.html'; return; }
  document.getElementById('userEmail').textContent = session.user.email + ' · 退出';
  loadStoreFilter();
  loadStats();
  load();
});

async function initSupabase(){
  const cfg = await fetch('/.netlify/functions/get-config').then(r=>r.json());
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
}

async function logout(){ await sb.auth.signOut(); location.href='index.html'; }

const storeNames = {};
async function loadStoreFilter(){
  const { data } = await sb.from('stores').select('store_id,name_zh').order('store_id');
  const sel = document.getElementById('storeFilter');
  (data||[]).forEach(s => {
    storeNames[s.store_id] = s.name_zh;
    const opt = document.createElement('option');
    opt.value = s.store_id; opt.textContent = s.name_zh;
    sel.appendChild(opt);
  });
}

async function loadStats(){
  const { data } = await sb.from('orders').select('status,total');
  if (!data) return;
  document.getElementById('statTotal').textContent   = data.length;
  document.getElementById('statPaid').textContent    = data.filter(o=>o.status==='paid').length;
  document.getElementById('statPending').textContent = data.filter(o=>o.status==='pending').length;
  const revenue = data.filter(o=>o.status==='paid').reduce((s,o)=>s+(parseFloat(o.total)||0),0);
  document.getElementById('statRevenue').textContent = '$'+revenue.toFixed(2);
}

async function load(){
  const store  = document.getElementById('storeFilter').value;
  const status = document.getElementById('statusFilter').value;
  const from   = document.getElementById('dateFrom').value;
  const to     = document.getElementById('dateTo').value;

  let q = sb.from('orders').select('*', {count:'exact'})
    .order('created_at', {ascending:false})
    .range(currentPage*PAGE_SIZE, (currentPage+1)*PAGE_SIZE-1);

  if (store)  q = q.eq('store_id', store);
  if (status) q = q.eq('status', status);
  if (from)   q = q.gte('created_at', from);
  if (to)     q = q.lte('created_at', to+'T23:59:59');

  const { data, count, error } = await q;
  if (error) { alert('加载失败: '+error.message); return; }

  totalCount = count||0;
  renderTable(data||[]);
  updatePagination();
}

function renderTable(list){
  const tbody = document.getElementById('orderTbody');
  if (!list.length){
    tbody.innerHTML='<tr><td colspan="8" style="text-align:center;padding:30px;color:#888;">没有订单记录</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(o => {
    const items = Array.isArray(o.items) ? o.items : [];
    const itemSummary = items.slice(0,2).map(i=>{
      const name = i.sku || (i.price ? i.price.slice(-8) : '?');
      const qty  = i.qty  || i.quantity || 1;
      return name+'×'+qty;
    }).join(', ')+(items.length>2?'…':'');
    const dt = new Date(o.created_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    return `<tr onclick="openDetail('${o.id}')">
      <td style="color:#888;font-size:12px;">${dt}</td>
      <td>${storeNames[o.store_id] || o.store_id}</td>
      <td style="color:#555;font-size:12px;">${itemSummary||'-'}</td>
      <td class="price">$${Number(o.subtotal||0).toFixed(2)}</td>
      <td class="price" style="color:#888;">$${Number(o.delivery_fee||0).toFixed(2)}</td>
      <td class="price">$${Number(o.total||0).toFixed(2)}</td>
      <td><span class="badge badge-${o.status}">${statusLabel(o.status)}</span></td>
      <td><button class="btn btn-secondary" style="padding:4px 10px;font-size:11px;" onclick="event.stopPropagation();openDetail('${o.id}')">详情</button></td>
    </tr>`;
  }).join('');
}

function statusLabel(s){ return {pending:'待付款',paid:'已付款',cancelled:'已取消'}[s]||s; }

function updatePagination(){
  const total = Math.ceil(totalCount/PAGE_SIZE);
  document.getElementById('pageInfo').textContent = `第 ${currentPage+1} / ${total||1} 页，共 ${totalCount} 条`;
  document.getElementById('btnPrev').disabled = currentPage===0;
  document.getElementById('btnNext').disabled = (currentPage+1)*PAGE_SIZE >= totalCount;
}
function prevPage(){ if(currentPage>0){ currentPage--; load(); } }
function nextPage(){ if((currentPage+1)*PAGE_SIZE<totalCount){ currentPage++; load(); } }

async function openDetail(id){
  currentOrderId = id;
  const { data: o } = await sb.from('orders').select('*').eq('id',id).single();
  if (!o) return;

  const items = Array.isArray(o.items) ? o.items : [];
  const dt = new Date(o.created_at).toLocaleString('zh-CN');
  const addr = o.shipping_address ? JSON.stringify(o.shipping_address,null,2) : '未填写';

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-row"><span class="detail-label">订单 ID</span><span style="font-family:monospace;font-size:11px;">${o.id}</span></div>
    <div class="detail-row"><span class="detail-label">门店</span><span>${o.store_id}</span></div>
    <div class="detail-row"><span class="detail-label">时间</span><span>${dt}</span></div>
    <div class="detail-row"><span class="detail-label">状态</span><span><span class="badge badge-${o.status}">${statusLabel(o.status)}</span></span></div>
    <div class="detail-row"><span class="detail-label">Stripe ID</span><span style="font-size:11px;font-family:monospace;">${o.stripe_session_id||'-'}</span></div>
    <div class="detail-row"><span class="detail-label">客户邮箱</span><span>${o.customer_email||'-'}</span></div>
    <div class="detail-row"><span class="detail-label">客户电话</span><span>${o.customer_phone||'-'}</span></div>
    <div class="detail-row"><span class="detail-label">配送地址</span><span style="font-size:11px;white-space:pre-wrap;">${addr}</span></div>
    <div style="margin-top:14px;font-weight:600;font-size:13px;margin-bottom:6px;">商品明细</div>
    <div class="item-list">
      ${items.map(i=>{
        const name = i.sku || (i.price ? i.price.slice(-8) : '?');
        const qty  = i.qty  || i.quantity || 1;
        return '<div class="item-row"><span>'+name+'</span><span>× '+qty+'</span></div>';
      }).join('')}
    </div>
    <div class="detail-row" style="margin-top:10px;"><span class="detail-label">小计</span><span class="price">$${Number(o.subtotal||0).toFixed(2)}</span></div>
    <div class="detail-row"><span class="detail-label">配送费</span><span class="price">$${Number(o.delivery_fee||0).toFixed(2)}</span></div>
    <div class="detail-row"><span class="detail-label" style="font-weight:700;">合计</span><span class="price" style="font-size:15px;">$${Number(o.total||0).toFixed(2)}</span></div>
  `;

  const btn = document.getElementById('markPaidBtn');
  btn.style.display = o.status==='pending' ? 'block' : 'none';
  document.getElementById('detailOverlay').classList.add('show');
}

async function markPaid(){
  if (!currentOrderId) return;
  const { error } = await sb.from('orders').update({status:'paid'}).eq('id',currentOrderId);
  if (error) { alert('更新失败: '+error.message); return; }
  closeDetailDirect();
  loadStats();
  load();
}

function closeDetail(e){ if(e.target.id==='detailOverlay') closeDetailDirect(); }
function closeDetailDirect(){ document.getElementById('detailOverlay').classList.remove('show'); }
</script>
</body>
</html>
